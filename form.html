    <main>

        <div class="container py-4">

            <h1 class="titulo">CONTACT</h1>

            <div class="formulario">

                <form>

                    <div class="row">

                        <div class="col-md-12 mb-3">

                            <label for="nome">Full name</label>

                            <input
                                type="text"
                                class="form-control"
                                id="nome"
                                name="nome"
                                placeholder="Enter your full name"
                                required
                                minlength="3"
                                maxlength="50"
                                pattern="[A-Za-zÀ-ÿ\s]+"
                                title="Enter letters and spaces only.">

                        </div>


                    <div class="mb-3">

                        <label for="email">E-mail</label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="example@email.com"
                            required>

                    </div>


                    <div class="mb-3">

                        <label for="telefone">Phone</label>

                        <input
                            type="tel"
                            class="form-control"
                            id="telefone"
                            name="telefone"
                            placeholder="(11) 99999-9999"
                            required
                            pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                            title="Enter the phone number in the format (11) 99999-9999.">

                    </div>


                    <div class="mb-3">

                        <label for="avaliacao">Rate our website</label>

                        <select
                            class="form-select"
                            id="avaliacao"
                            name="avaliacao"
                            required>

                            <option value="" selected disabled>
                                Select a rating
                            </option>

                            <option value="1">1 - Very poor</option>
                            <option value="2">2 - Poor</option>
                            <option value="3">3 - Average</option>
                            <option value="4">4 - Good</option>
                            <option value="5">5 - Excellent</option>

                        </select>

                    </div>


                    <div class="mb-3">

                        <label for="mensagem">Comment</label>

                        <textarea
                            class="form-control textarea-travado"
                            id="mensagem"
                            name="mensagem"
                            rows="5"
                            placeholder="Enter your comment"
                            maxlength="500"></textarea>

                    </div>


                    <div class="botao">

                        <button
                            class="btn btn-primary"
                            type="submit">
                            Send message
                        </button>

                        <button
                            class="btn btn-limpar"
                            type="reset">
                            Clear form
                        </button>

                    </div>

                </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-YvpcrYzBz9I3M3v4tWw9h7wVJ2s3s8l0J5jY8wY7x6y5z4x3w2v1u0t9s8r7q6p5" 
        crossorigin="anonymous"></script>

    <script>
        document.querySelectorAll("input, select, textarea").forEach(function (campo) {

            campo.addEventListener("invalid", function () {

                if (campo.validity.valueMissing) {
                    campo.setCustomValidity("Please fill out this field.");
                } 
                else if (campo.validity.typeMismatch) {
                    campo.setCustomValidity("Please enter a valid email address.");
                } 
                else if (campo.validity.patternMismatch) {
                    campo.setCustomValidity(campo.title || "Please enter a valid value.");
                } 
                else if (campo.validity.tooShort) {
                    campo.setCustomValidity("Please enter at least " + campo.minLength + " characters.");
                } 
                else {
                    campo.setCustomValidity("Please enter a valid value.");
                }

            });

            campo.addEventListener("input", function () {
                campo.setCustomValidity("");
            });

        });
    </script>
