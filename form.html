    <main>

        <div class="container py-4">

            <h1 class="titulo">CONTACT</h1>

            <div class="formulario">

                <!-- Adicionado um ID no formulário para facilitar a manipulação pelo JavaScript -->
                <form id="contactForm">

                    <!-- Elemento onde vai aparecer a mensagem de sucesso -->
                    <div id="mensagemSucesso" class="alert alert-success d-none" role="alert">
                        Your feedback has been successfully received, thank you for watching :)
                    </div>

                    <div class="mb-3">

                            <label for="nome">Full name</label>

                            <input
                                type="text"
                                class="form-control"
                                id="nome"
                                name="nome"
                                placeholder="Enter your full name"
                                required
                                minlength="3"
                                maxlength="50"
                                pattern="[A-Za-zÀ-ÿ\s]+"
                                title="Enter letters and spaces only.">

                        </div>


                    <div class="mb-3">

                        <label for="email">E-mail</label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="example@email.com"
                            required>

                    </div>


                    <div class="mb-3">

                        <label for="telefone">Phone</label>

                        <input
                            type="tel"
                            class="form-control"
                            id="telefone"
                            name="telefone"
                            placeholder="(11) 99999-9999"
                            required
                            pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                            title="Enter the phone number in the format (11) 99999-9999.">

                    </div>


                    <div class="mb-3">

                        <label for="avaliacao">Rate our website</label>

                        <select
                            class="form-select"
                            id="avaliacao"
                            name="avaliacao"
                            required>

                            <option value="" selected disabled>
                                Select a rating
                            </option>

                            <option value="1">1 - Very poor</option>
                            <option value="2">2 - Poor</option>
                            <option value="3">3 - Average</option>
                            <option value="4">4 - Good</option>
                            <option value="5">5 - Excellent</option>

                        </select>

                    </div>


                    <div class="mb-3">

                        <label for="mensagem">Comment</label>

                        <textarea
                            class="form-control textarea-travado"
                            id="mensagem"
                            name="mensagem"
                            rows="5"
                            placeholder="Enter your comment"
                            maxlength="500"></textarea>

                    </div>


                    <div class="botao">

                        <button
                            class="btn btn-primary"
                            type="submit">
                            Send message
                        </button>

                        <button
                            class="btn btn-limpar"
                            type="reset">
                            Clear form
                        </button>

                    </div>

                </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
        crossorigin="anonymous"></script>

    <script>
        document.querySelectorAll("input, select, textarea").forEach(function (campo) {

            campo.addEventListener("invalid", function () {

                if (campo.validity.valueMissing) {
                    campo.setCustomValidity("Please fill out this field.");
                } 
                else if (campo.validity.typeMismatch) {
                    campo.setCustomValidity("Please enter a valid email address.");
                } 
                else if (campo.validity.patternMismatch) {
                    campo.setCustomValidity(campo.title || "Please enter a valid value.");
                } 
                else if (campo.validity.tooShort) {
                    campo.setCustomValidity("Please enter at least " + campo.minLength + " characters.");
                } 
                else {
                    campo.setCustomValidity("Please enter a valid value.");
                }

            });

            campo.addEventListener("input", function () {
                campo.setCustomValidity("");
            });

        });

        // Código adicionado para lidar com o envio do formulário e exibir a mensagem
        const form = document.getElementById("contactForm");
        const mensagemSucesso = document.getElementById("mensagemSucesso");

        form.addEventListener("submit", function (event) {
            event.preventDefault(); // Impede o envio real e o recarregamento da página

            // Exibe a mensagem removendo a classe do Bootstrap 'd-none' (que oculta o elemento)
            mensagemSucesso.classList.remove("d-none");

            // Limpa o formulário
            form.reset();

            // Oculta a mensagem automaticamente depois de 5 segundos (opcional)
            setTimeout(function () {
                mensagemSucesso.classList.add("d-none");
            }, 5000);
        });
    </script>
